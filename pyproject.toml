[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant-research"
version = "0.9.0"
description = "The referee that reads every paper you cite: code-verified numbers, citations, statistics and live experiment checks for Claude Code, Codex and OpenCode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["claude-code", "research", "reproducibility", "pre-registration", "llm"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
warrant = "warrant.cli:main"

[tool.setuptools]
packages = ["warrant"]
